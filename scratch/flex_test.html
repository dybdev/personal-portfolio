<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
  width: 1500px;
  gap: 28px;
  background: #333;
}
.card {
  height: 300px;
  background: #555;
  transition: all 500ms cubic-bezier(0.25, 1, 0.5, 1);
  overflow: hidden;
}
.card.folded {
  flex: 0 0 260px;
  width: 260px;
}
.card.expanded {
  flex: 1 1 0%;
}
</style>
</head>
<body>
<div class="container" id="cont">
  <div class="card expanded" id="c1">Card 1</div>
  <div class="card folded" id="c2">Card 2</div>
  <div class="card folded" id="c3">Card 3</div>
</div>
</body>
</html>
